# =====================================================================================
# FILE CẤU HÌNH MONGODB REPLICA SET - DÀNH RIÊNG CHO NODE 4 (192.168.1.224)
# Vai trò: Node 4 - SECONDARY 3 / ARBITER (Khi nhóm muốn cả 4 máy đều tham gia cụm MongoDB)
# Đường dẫn ghi đè trên Windows: C:\Program Files\MongoDB\Server\9.0\bin\mongod.cfg
# =====================================================================================

storage:
  dbPath: C:\Program Files\MongoDB\Server\9.0\data

systemLog:
  destination: file
  logAppend: true
  path: C:\Program Files\MongoDB\Server\9.0\log\mongod.log

net:
  port: 27017
  bindIp: 0.0.0.0

replication:
  replSetName: "rsEcomNhom2"

