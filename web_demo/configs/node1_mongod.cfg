# =====================================================================================
# FILE CẤU HÌNH MONGODB REPLICA SET - DÀNH RIÊNG CHO NODE 1 (192.168.1.221)
# Vai trò: Node 1 - PRIMARY (Ưu tiên bầu chọn Priority = 2)
# Đường dẫn ghi đè trên Windows: C:\Program Files\MongoDB\Server\9.0\bin\mongod.cfg
# =====================================================================================

storage:
  dbPath: C:\Program Files\MongoDB\Server\9.0\data

systemLog:
  destination: file
  logAppend: true
  path: C:\Program Files\MongoDB\Server\9.0\log\mongod.log

net:
  port: 27017
  bindIp: 0.0.0.0

replication:
  replSetName: "rsEcomNhom2"

